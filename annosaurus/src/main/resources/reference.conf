http {
  port = 8080
  port = ${?HTTP_PORT}

  stop.timeout = 90000
  stop.timeout = ${?HTTP_STOP_TIMEOUT}

  connector.idle.timeout=90000
  connector.idle.timeout=${?HTTP_CONNECTOR_IDLE_TIMEOUT}

  context.path = "v1"
  context.path = ${?HTTP_CONTEXT_PATH}

}

messaging {
  zeromq {
    enable = false
    enable = ${?MESSAGING_ZEROMQ_ENABLE}
    port = 5563
    port = ${?MESSAGING_ZEROMQ_PORT}
    topic = "vars"
    topic = ${?MESSAGING_ZEROMQ_TOPIC}
  }

  nats {
    enable = false
    enable = ${?MESSAGING_NATS_ENABLE}
    url = "nats://localhost:4222"
    url = ${?MESSAGING_NATS_URL}
    topic = "vars"
    topic = ${?MESSAGING_NATS_TOPIC}
  }
}


basicjwt {
  issuer = "http://www.mbari.org"
  issuer = ${?BASICJWT_ISSUER}
  # No defaults: these are required and must be supplied via the environment
  # (or application.conf). A placeholder default here would silently give every
  # deployment the same well-known secrets. Missing values fail at startup, the
  # same way database.url and database.driver do.
  client.secret = ${?BASICJWT_CLIENT_SECRET}
  signing.secret = ${?BASICJWT_SIGNING_SECRET}
}

# --- Configure database
database {
  loglevel = "INFO"
  loglevel = ${?DATABASE_LOG_LEVEL}
  driver = ${?DATABASE_DRIVER}
  password = ""
  password = ${?DATABASE_PASSWORD}
  url = ${?DATABASE_URL}
  user = "sa"
  user = ${?DATABASE_USER}
  query.view = "annotations"
  query.view = ${?DATABASE_QUERY_VIEW}
}
